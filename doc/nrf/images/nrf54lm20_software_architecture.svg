<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
     width="1000" height="1200" viewBox="0 0 1000 1200" xml:space="preserve">
  <style type="text/css">
    <![CDATA[
      .box { fill:#E8F4F8; stroke:#00A9CE; stroke-width:2; }
      .box-dark { fill:#B3D9E8; stroke:#0077C8; stroke-width:2; }
      .box-darker { fill:#7FB8D4; stroke:#005A96; stroke-width:2; }
      .box-header { fill:#00A9CE; stroke:#0077C8; stroke-width:2; }
      .box-hw { fill:#FFF3E0; stroke:#FF6F00; stroke-width:2; }
      .text-title { fill:#FFFFFF; font-family:Arial; font-size:20px; font-weight:bold; text-anchor:middle; }
      .text-header { fill:#FFFFFF; font-family:Arial; font-size:16px; font-weight:bold; text-anchor:middle; }
      .text-normal { fill:#000000; font-family:Arial; font-size:12px; text-anchor:start; }
      .text-small { fill:#000000; font-family:Arial; font-size:10px; text-anchor:start; }
      .text-center { fill:#000000; font-family:Arial; font-size:12px; text-anchor:middle; }
      .arrow { stroke:#00A9CE; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
    ]]>
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00A9CE" />
    </marker>
  </defs>

  <!-- Title -->
  <rect x="50" y="20" width="900" height="50" class="box-header"/>
  <text x="500" y="52" class="text-title">nRF54LM20 Software Architecture</text>
  
  <!-- Applications Layer -->
  <rect x="50" y="90" width="900" height="50" class="box-header"/>
  <text x="500" y="122" class="text-header">Applications Layer</text>
  
  <rect x="70" y="150" width="180" height="60" class="box"/>
  <text x="160" y="175" class="text-center">Bluetooth</text>
  <text x="160" y="192" class="text-small">• BLE Applications</text>
  <text x="160" y="204" class="text-small">• Fast Pair</text>
  
  <rect x="270" y="150" width="180" height="60" class="box"/>
  <text x="360" y="175" class="text-center">Thread</text>
  <text x="360" y="192" class="text-small">• FTD Applications</text>
  <text x="360" y="204" class="text-small">• Border Router</text>
  
  <rect x="470" y="150" width="180" height="60" class="box"/>
  <text x="560" y="175" class="text-center">Matter</text>
  <text x="560" y="192" class="text-small">• Smart Home</text>
  <text x="560" y="204" class="text-small">• OTA DFU</text>
  
  <rect x="670" y="150" width="180" height="60" class="box"/>
  <text x="760" y="175" class="text-center">NFC</text>
  <text x="760" y="192" class="text-small">• Type 2 Tag</text>
  <text x="760" y="204" class="text-small">• NDEF</text>

  <!-- Libraries & Services Layer -->
  <rect x="50" y="230" width="900" height="50" class="box-header"/>
  <text x="500" y="262" class="text-header">Libraries &amp; Services</text>
  
  <!-- Protocol Libraries -->
  <rect x="70" y="290" width="270" height="140" class="box-dark"/>
  <text x="205" y="308" class="text-center" font-weight="bold">Protocol Libraries</text>
  <text x="80" y="328" class="text-normal">• Bluetooth Host Stack</text>
  <text x="80" y="348" class="text-normal">• OpenThread Stack</text>
  <text x="80" y="368" class="text-normal">• Matter Framework</text>
  <text x="80" y="388" class="text-normal">• NFC Libraries (T2T, NDEF)</text>
  <text x="80" y="408" class="text-normal">• Low Latency Packet Mode</text>
  
  <!-- Application Libraries -->
  <rect x="360" y="290" width="270" height="140" class="box-dark"/>
  <text x="495" y="308" class="text-center" font-weight="bold">Application Libraries</text>
  <text x="370" y="328" class="text-normal">• DFU Target</text>
  <text x="370" y="348" class="text-normal">• Flash Patch</text>
  <text x="370" y="368" class="text-normal">• Event Manager</text>
  <text x="370" y="388" class="text-normal">• Common Application Framework</text>
  <text x="370" y="408" class="text-normal">• nRF RPC</text>
  
  <!-- Utilities -->
  <rect x="650" y="290" width="270" height="140" class="box-dark"/>
  <text x="785" y="308" class="text-center" font-weight="bold">Utilities &amp; Services</text>
  <text x="660" y="328" class="text-normal">• Settings Storage</text>
  <text x="660" y="348" class="text-normal">• Secure Storage</text>
  <text x="660" y="368" class="text-normal">• Shell</text>
  <text x="660" y="388" class="text-normal">• Logging</text>
  <text x="660" y="408" class="text-normal">• Tracing</text>

  <!-- Middleware Layer -->
  <rect x="50" y="450" width="900" height="50" class="box-header"/>
  <text x="500" y="482" class="text-header">Middleware &amp; RTOS</text>
  
  <!-- Zephyr RTOS -->
  <rect x="70" y="510" width="420" height="160" class="box-dark"/>
  <text x="280" y="530" class="text-center" font-weight="bold">Zephyr RTOS</text>
  <text x="80" y="555" class="text-normal">• Kernel (Multithreading, Scheduling)</text>
  <text x="80" y="575" class="text-normal">• Device Drivers (GPIO, UART, SPI, I2C)</text>
  <text x="80" y="595" class="text-normal">• Bluetooth Controller (Link Layer)</text>
  <text x="80" y="615" class="text-normal">• Network Stack</text>
  <text x="80" y="635" class="text-normal">• File Systems</text>
  <text x="80" y="655" class="text-normal">• Power Management</text>
  
  <!-- Security & Bootloader -->
  <rect x="510" y="510" width="410" height="160" class="box-dark"/>
  <text x="715" y="530" class="text-center" font-weight="bold">Security &amp; Boot</text>
  <text x="520" y="555" class="text-normal">• TF-M (Trusted Firmware-M)</text>
  <text x="520" y="575" class="text-normal">• PSA Crypto API</text>
  <text x="520" y="595" class="text-normal">• nRF Security (mbedTLS)</text>
  <text x="520" y="615" class="text-normal">• MCUboot (Secure Bootloader)</text>
  <text x="520" y="635" class="text-normal">• Firmware Info</text>
  <text x="520" y="655" class="text-normal">• Immutable/Upgradable Bootloader</text>

  <!-- Hardware Abstraction Layer -->
  <rect x="50" y="690" width="900" height="50" class="box-header"/>
  <text x="500" y="722" class="text-header">Hardware Abstraction Layer</text>
  
  <!-- HAL Components -->
  <rect x="70" y="750" width="270" height="140" class="box-darker"/>
  <text x="205" y="768" class="text-center" font-weight="bold">HAL &amp; Drivers</text>
  <text x="80" y="788" class="text-normal">• CRACEN Crypto Driver</text>
  <text x="80" y="808" class="text-normal">• GRTC (Timer)</text>
  <text x="80" y="828" class="text-normal">• GPIOTE</text>
  <text x="80" y="848" class="text-normal">• UARTE, TWIM</text>
  <text x="80" y="868" class="text-normal">• nrfx Peripheral Drivers</text>
  
  <!-- Multi-core Support -->
  <rect x="360" y="750" width="270" height="140" class="box-darker"/>
  <text x="495" y="768" class="text-center" font-weight="bold">Multi-core Support</text>
  <text x="370" y="788" class="text-normal">• VPR/FLPR Core Support</text>
  <text x="370" y="808" class="text-normal">• IPC (Inter-Processor Comm)</text>
  <text x="370" y="828" class="text-normal">• FLPR SRAM/RRAM Execution</text>
  <text x="370" y="848" class="text-normal">• Memory Management</text>
  <text x="370" y="868" class="text-normal">• Core Bootstrapping</text>
  
  <!-- Memory & Storage -->
  <rect x="650" y="750" width="270" height="140" class="box-darker"/>
  <text x="785" y="768" class="text-center" font-weight="bold">Memory &amp; Storage</text>
  <text x="660" y="788" class="text-normal">• RRAM (Resistive RAM)</text>
  <text x="660" y="808" class="text-normal">• KMU (Key Management Unit)</text>
  <text x="660" y="828" class="text-normal">• ZMS (Zephyr Memory Storage)</text>
  <text x="660" y="848" class="text-normal">• Flash Management</text>
  <text x="660" y="868" class="text-normal">• Partition Manager</text>

  <!-- Hardware Layer -->
  <rect x="50" y="910" width="900" height="50" class="box-header"/>
  <text x="500" y="942" class="text-header">Hardware Layer</text>
  
  <!-- nRF54LM20 Hardware -->
  <rect x="70" y="970" width="860" height="180" class="box-hw"/>
  <text x="500" y="992" class="text-center" font-weight="bold" font-size="16">nRF54LM20A SoC</text>
  
  <text x="80" y="1020" class="text-normal" font-weight="bold">CPU Cores:</text>
  <text x="80" y="1040" class="text-normal">• Arm Cortex-M33 Application Core (128 MHz)</text>
  <text x="80" y="1060" class="text-normal">• RISC-V VPR (Fast Lightweight Peripheral Processor - FLPR)</text>
  
  <text x="520" y="1020" class="text-normal" font-weight="bold">Cryptography:</text>
  <text x="520" y="1040" class="text-normal">• CRACEN (Crypto Accelerator Engine)</text>
  <text x="520" y="1060" class="text-normal">• IKG (Isolated Key Generator)</text>
  <text x="520" y="1080" class="text-normal">• KMU (Key Management Unit)</text>
  
  <text x="80" y="1090" class="text-normal" font-weight="bold">Wireless:</text>
  <text x="80" y="1110" class="text-normal">• 2.4 GHz Radio (Bluetooth LE, Thread, Matter)</text>
  <text x="80" y="1130" class="text-normal">• NFC-A Tag</text>
  
  <text x="520" y="1110" class="text-normal" font-weight="bold">Memory:</text>
  <text x="520" y="1130" class="text-normal">• RRAM, SRAM (RAM_00, RAM_01)</text>

  <!-- Legend -->
  <rect x="70" y="1165" width="120" height="20" class="box"/>
  <text x="200" y="1180" class="text-small">Application Layer</text>
  
  <rect x="300" y="1165" width="120" height="20" class="box-dark"/>
  <text x="430" y="1180" class="text-small">Middleware/Services</text>
  
  <rect x="530" y="1165" width="120" height="20" class="box-darker"/>
  <text x="660" y="1180" class="text-small">HAL/Drivers</text>
  
  <rect x="760" y="1165" width="120" height="20" class="box-hw"/>
  <text x="890" y="1180" class="text-small">Hardware</text>

</svg>
